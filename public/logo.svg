<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="25%" stop-color="#f5d061"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#e5c158"/>
    </linearGradient>

    <!-- Deep Gold Shadow -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6308"/>
    </linearGradient>

    <!-- Glow & Shadow Filter -->
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#700b1d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#royalShadow)" transform="translate(256, 256) scale(1.15)">
    <!-- Crown Base Arch -->
    <path d="M -140 100 Q 0 120 140 100 L 130 65 Q 0 85 -130 65 Z" fill="url(#goldDark)"/>
    <path d="M -130 65 Q 0 85 130 65 L 125 45 Q 0 65 -125 45 Z" fill="url(#goldGrad)"/>

    <!-- Main Crown Peaks -->
    <path d="
      M -125 45 
      L -160 -40 
      L -75 5 
      L 0 -95 
      L 75 5 
      L 160 -40 
      L 125 45 
      Q 0 65 -125 45 
      Z
    " fill="url(#goldGrad)"/>

    <!-- Inner Shading on Central Peak -->
    <path d="M 0 -95 L 35 15 L 0 50 L -35 15 Z" fill="url(#goldDark)" opacity="0.35"/>

    <!-- Crown Jewels on Peaks -->
    <!-- Center Jewel (Big Diamond) -->
    <circle cx="0" cy="-100" r="14" fill="#ffffff" stroke="#d4af37" stroke-width="3"/>
    <circle cx="0" cy="-100" r="7" fill="#f5d061"/>

    <!-- Side Left Jewel -->
    <circle cx="-160" cy="-45" r="11" fill="#ffffff" stroke="#d4af37" stroke-width="2.5"/>
    <circle cx="-160" cy="-45" r="5" fill="#f5d061"/>

    <!-- Side Right Jewel -->
    <circle cx="160" cy="-45" r="11" fill="#ffffff" stroke="#d4af37" stroke-width="2.5"/>
    <circle cx="160" cy="-45" r="5" fill="#f5d061"/>

    <!-- Mid Left Peak Jewel -->
    <circle cx="-75" cy="0" r="9" fill="#ffffff" stroke="#d4af37" stroke-width="2"/>
    <circle cx="-75" cy="0" r="4" fill="#f5d061"/>

    <!-- Mid Right Peak Jewel -->
    <circle cx="75" cy="0" r="9" fill="#ffffff" stroke="#d4af37" stroke-width="2"/>
    <circle cx="75" cy="0" r="4" fill="#f5d061"/>

    <!-- Base Ruby & Emerald Insets -->
    <circle cx="-80" cy="85" r="6" fill="#700b1d" stroke="#f5d061" stroke-width="1.5"/>
    <circle cx="-40" cy="90" r="5" fill="#ffffff" stroke="#f5d061" stroke-width="1.5"/>
    <circle cx="0" cy="92" r="8" fill="#700b1d" stroke="#f5d061" stroke-width="2"/>
    <circle cx="40" cy="90" r="5" fill="#ffffff" stroke="#f5d061" stroke-width="1.5"/>
    <circle cx="80" cy="85" r="6" fill="#700b1d" stroke="#f5d061" stroke-width="1.5"/>

    <!-- Sparkle Stars -->
    <path d="M 0 -130 Q 0 -115 15 -115 Q 0 -115 0 -100 Q 0 -115 -15 -115 Q 0 -115 0 -130 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
